services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: cdms_user
      POSTGRES_PASSWORD: cdms_password
      POSTGRES_DB: cdms_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cdms_user -d cdms_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://cdms_user:cdms_password@db:5432/cdms_db
      - SECRET_KEY=${SECRET_KEY}
      - COOKIE_SECURE=False
      - REDIS_URL=redis://redis:6379/0
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.1-flash-lite-preview}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Only mount source code — NOT the venv/pip cache
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=http://localhost:8000/api
    depends_on:
      - backend
    volumes:
      # Mount source for hot-reload
      - ./frontend:/app
      # Use a named volume for node_modules so the container's
      # installed packages are NEVER overwritten by the host folder
      - frontend_node_modules:/app/node_modules

volumes:
  postgres_data:
  frontend_node_modules:
